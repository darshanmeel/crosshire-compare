<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">CrossHire Compare</title>
  <desc id="d">Two tables, every difference, in one page. Streamlit and DuckDB; a CSV, JSON or database table on either side.</desc>
  <rect width="1200" height="360" fill="#0e0d0b"/>
  <!-- the aperture mark: outer thin ring, inner dotted ring, solid disc with a crosshair cut -->
  <g transform="translate(64 142) scale(2.4)">
    <circle cx="20" cy="20" r="18.5" fill="none" stroke="#f4b87c" stroke-width="0.7" opacity="0.55"/>
    <circle cx="20" cy="20" r="13.5" fill="none" stroke="#f4b87c" stroke-width="0.7" stroke-dasharray="1.2 2.2" opacity="0.7"/>
    <circle cx="20" cy="20" r="9" fill="#f4b87c"/>
    <line x1="20" y1="15.5" x2="20" y2="24.5" stroke="#0e0d0b" stroke-width="1.4"/>
    <line x1="15.5" y1="20" x2="24.5" y2="20" stroke="#0e0d0b" stroke-width="1.4"/>
  </g>
  <!-- eyebrow, wordmark, tagline -->
  <text x="196" y="132" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.8" fill="#7a7159">STREAMLIT <tspan fill="#f4b87c">·</tspan> DUCKDB <tspan fill="#f4b87c">·</tspan> CSV OR JSON, EITHER SIDE</text>
  <text x="196" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="54" letter-spacing="-1" fill="#f4ead6">CrossHire <tspan font-style="italic" fill="#f4b87c">Compare</tspan></text>
  <text x="196" y="238" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#b8ad94">Two tables, every difference, in one page.</text>
  <line x1="196" y1="266" x2="690" y2="266" stroke="#f4b87c" stroke-opacity="0.15"/>
  <text x="196" y="292" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#7a7159">python compare_app.py <tspan fill="#4d4128">·</tspan> Streamlit + DuckDB <tspan fill="#4d4128">·</tspan> one HTML report</text>
  <!-- the report, abstracted: three stat tiles, then paired rows - Left black, Right cream -->
  <rect x="740" y="56" width="400" height="248" rx="12" fill="#17150f" stroke="#f4b87c" stroke-opacity="0.15"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="8.5" letter-spacing="1.2" fill="#7a7159">
      <rect x="758" y="74" width="108" height="52" rx="6" fill="#1f1c14" stroke="#f4b87c" stroke-opacity="0.08"/>
      <rect x="886" y="74" width="108" height="52" rx="6" fill="#1f1c14" stroke="#f4b87c" stroke-opacity="0.08"/>
      <rect x="1014" y="74" width="108" height="52" rx="6" fill="#1f1c14" stroke="#f4b87c" stroke-opacity="0.08"/>
      <text x="768" y="91">ROWS PAIRED</text>
      <text x="896" y="91">DIFFER</text>
      <text x="1024" y="91">ONE-SIDED</text>
      <text x="768" y="162">ROWS THAT DIFFER <tspan fill="#4d4128">·</tspan> LEFT ABOVE RIGHT</text>
    </g>
    <g font-family="Georgia, 'Times New Roman', serif" font-size="22">
      <text x="768" y="116" fill="#7fb069">2,960</text>
      <text x="896" y="116" fill="#c97064">649</text>
      <text x="1024" y="116" fill="#f4ead6">65</text>
    </g>
    <!-- column headers -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="8.5" letter-spacing="0.6" fill="#7a7159">
      <text x="794" y="184">emp_id</text>
      <text x="866" y="184">hire_date</text>
      <text x="946" y="184">salary</text>
      <text x="1000" y="184">active</text>
      <text x="1046" y="184">dept</text>
    </g>
    <!-- pair 1 -->
    <rect x="758" y="190" width="364" height="24" fill="#0e0d0b"/>
    <rect x="940" y="190" width="56" height="24" fill="#4a2521"/>
    <g font-size="10.5" fill="#f4ead6">
      <text x="763" y="206" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="7.5" letter-spacing="1" fill="#7a7159">L</text>
      <text x="794" y="206">E10017</text>
      <text x="866" y="206">2018-03-11</text>
      <text x="946" y="206" fill="#f3cdc4" font-weight="600">9973.89</text>
      <text x="1000" y="206">false</text>
      <text x="1046" y="206">Operations</text>
    </g>
    <rect x="758" y="214" width="364" height="24" fill="#f4ead6"/>
    <rect x="940" y="214" width="56" height="24" fill="#ebc2b7"/>
    <g font-size="10.5" fill="#0e0d0b">
      <text x="763" y="230" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="7.5" letter-spacing="1" fill="#7a7159">R</text>
      <text x="794" y="230">E10017</text>
      <text x="866" y="230">2018-03-11</text>
      <text x="946" y="230" fill="#4a2521" font-weight="600">9993.62</text>
      <text x="1000" y="230">false</text>
      <text x="1046" y="230">Operations</text>
    </g>
    <!-- pair 2 -->
    <rect x="758" y="244" width="364" height="24" fill="#0e0d0b"/>
    <rect x="1040" y="244" width="82" height="24" fill="#4a2521"/>
    <g font-size="10.5" fill="#f4ead6">
      <text x="763" y="260" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="7.5" letter-spacing="1" fill="#7a7159">L</text>
      <text x="794" y="260">E10042</text>
      <text x="866" y="260">2024-01-05</text>
      <text x="946" y="260">5865.69</text>
      <text x="1000" y="260">true</text>
      <text x="1046" y="260" fill="#f3cdc4" font-weight="600">Engineering</text>
    </g>
    <rect x="758" y="268" width="364" height="24" fill="#f4ead6"/>
    <rect x="1040" y="268" width="82" height="24" fill="#ebc2b7"/>
    <g font-size="10.5" fill="#0e0d0b">
      <text x="763" y="284" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="7.5" letter-spacing="1" fill="#7a7159">R</text>
      <text x="794" y="284">E10042</text>
      <text x="866" y="284">2024-01-05</text>
      <text x="946" y="284">5865.69</text>
      <text x="1000" y="284">true</text>
      <text x="1046" y="284" fill="#4a2521" font-weight="600">Eng</text>
    </g>
  </g>
</svg>
