    <link rel="stylesheet" href="/theme.css" />
    <script>
      try {
        var m = localStorage.getItem("fs-mode");
        if (m !== "light" && m !== "dark") m = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-fs-mode", m);
      } catch (e) {}
    </script>
